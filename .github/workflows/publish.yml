name: Publish to npm

# Two runs per automatic release, one publish path:
#   - push to main: `prepare` turns any `.changes/*.md` notes into the next
#     version + CHANGELOG section, commits and tags it, then dispatches this
#     workflow on the new tag. No notes → nothing happens.
#   - a run on a v* tag (that dispatch, or a tag pushed by hand): `test` +
#     `publish`. Publishing only ever happens in a tag run, so npm's provenance
#     names the tagged release commit — the commit the package is built from.
#     (A run's provenance records the commit that STARTED it; publishing inside
#     the main run would credit the notes commit instead.)
# A tag pushed with GITHUB_TOKEN starts no run, but a workflow_dispatch does —
# that is why prepare dispatches rather than relying on the tag push.
# The file name is part of npm's Trusted Publisher config — do not rename it.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Main runs queue behind each other (a merge that lands mid-release waits, then
# reads the fresh main, so notes already released are gone). Each tag run is
# its own group, so a queued main run can never displace a pending publish.
concurrency:
  group: cms-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag
      actions: write # dispatch the tag run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Pinned Node/npm (.nvmrc → 22.x / npm 10.9): `npm version` rewrites the
      # lockfile's version fields, and an npm 11 write would break consumers.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Plan from change notes
        id: plan
        run: |
          PLAN=$(node tools/release/release-from-changes.mjs plan)
          echo "$PLAN"
          echo "release=$(node -p "JSON.parse(process.argv[1]).release" "$PLAN")" >> "$GITHUB_OUTPUT"
          echo "to=$(node -p "JSON.parse(process.argv[1]).to || ''" "$PLAN")" >> "$GITHUB_OUTPUT"

      - name: Version, changelog, commit and tag
        if: steps.plan.outputs.release == 'true'
        env:
          TO: ${{ steps.plan.outputs.to }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${TO}" >/dev/null; then
            echo "::error::Tag v${TO} already exists — fix package.json or the notes by hand"
            exit 1
          fi
          npm version "$TO" --no-git-tag-version
          node tools/release/release-from-changes.mjs apply --version "$TO"
          npm run check:lockfile-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package.json package-lock.json CHANGELOG.md .changes
          git commit -m "release: v${TO}"
          git tag "v${TO}"
          git push origin HEAD:main "v${TO}"

      - name: Start the publish run on the tag
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ steps.plan.outputs.to }}
        run: |
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "v${TO}"
          echo "::notice::v${TO} tagged; publishing in the run on refs/tags/v${TO}"

  # Quality gate: the tag must match package.json, and the suite must be green,
  # before anything reaches the registry. A red tree or a mis-tagged commit
  # fails here instead of publishing.
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Assert tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm accepts this workflow's identity token
    # directly — no NPM_TOKEN secret, nothing to expire or rotate. Configured
    # on npmjs.com under the package's Trusted Publisher settings.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      # OIDC publishing needs npm >= 11.5; the pinned Node (.nvmrc, 22.x) ships 10.9.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
