name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  # Quality gate: the tag must match package.json, and the suite must be green,
  # before anything reaches the registry. A red tree or a mis-tagged commit
  # fails here instead of publishing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Assert tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm accepts this workflow's identity token
    # directly — no NPM_TOKEN secret, nothing to expire or rotate. Configured
    # on npmjs.com under the package's Trusted Publisher settings.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      # OIDC publishing needs npm >= 11.5; the pinned Node 20.19 ships 10.8.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
